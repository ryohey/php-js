name: test262

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Substring filter for test paths (optional)'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

jobs:
  test262:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out tc39/test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          path: test262
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, opcache
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run test262 (ES5.1 subset)
        run: |
          php -d memory_limit=2G tests/test262/run.php \
            --test262 test262 \
            ${{ inputs.filter != '' && format('--filter {0}', inputs.filter) || '' }} \
            --list-failures 50 | tee test262-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test262-report
          path: test262-report.txt
